name: bank-in-a-box

services:
  postgres:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_USER: bank
      POSTGRES_DB: core
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d core"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: "no"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Local Blob storage emulator, for testing BlobStorage: docker compose --profile lake up -d azurite
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    profiles: ["lake"]
    restart: "no"
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck"]
    ports:
      - "10000:10000"

volumes:
  pgdata:
